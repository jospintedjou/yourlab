[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader']

[phases.build]
cmds = [
    'npm ci',
    'npm run build'
]

[start]
cmd = 'echo "Starting Container" && echo "Clearing caches..." && php artisan optimize:clear && php artisan storage:link && echo "Running migrations..." && php artisan migrate --force && echo "Seeding database..." && php artisan db:seed --force && echo "Caching for production..." && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan event:cache && echo "Starting Laravel server..." && /start-container.sh'
